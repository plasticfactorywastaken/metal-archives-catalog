name: Publish saved catalog

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_HOST: github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic exporter
        run: python -m pip install .
      - name: Verify artifact visibility helper
        run: python -m unittest tests.test_wait_pages_artifact -v
      - name: Restore existing verified snapshot only
        run: python scripts/cloud_state.py restore
      - name: Log catalog counts and checkpoint summary
        run: python -m catalog_mirror summary
      - name: Export saved catalog without source requests
        run: python -m catalog_mirror export --output site/data
      - name: Enforce free Pages size budget
        run: python scripts/check_site_size.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: site
          retention-days: 1
      - name: Wait for uploaded artifact visibility
        run: python scripts/wait_pages_artifact.py
      - uses: actions/deploy-pages@v4
        id: deployment
